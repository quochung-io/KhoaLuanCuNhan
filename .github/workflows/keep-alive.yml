name: Keep Cloud Backend Awake 24/7

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -fsS --max-time 60 --retry 3 --retry-delay 5 https://ecc-backend-api.onrender.com/api/health
